<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14262e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="用量">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
/* Decide the layout mode before first paint: mini (popup) / medium (short window) / large. Phones always use large. */
window.cupMode=function(){var ua=navigator.userAgent,d=document.documentElement,
phone=/Android|iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),
m=phone?"large":new URLSearchParams(location.search).has("mini")?"mini":innerHeight<=560?"medium":"large";
d.dataset.mode=m;d.dataset.phone=phone?"1":"0";return m;};cupMode();
</script>
<title>Claude 用量规划器</title>
</head>
<body>
<main id="app">
  <header class="row between">
    <h1 data-i="title"></h1>
    <div class="row">
      <button class="ghost sm" id="mini" title="一键变小窗 / 还原">小窗</button>
    </div>
  </header>
  <p class="sub full" id="head"></p>

  <section class="card" id="inputCard">
    <div class="row between">
      <label for="used" data-i="usedWeek"></label>
      <div class="row">
        <button class="ghost sm" data-d="-1">−1</button><button class="ghost sm" data-d="1">+1</button><button class="ghost sm" data-d="5">+5</button>
        <input id="used" type="number" min="0" max="100" step="0.5" inputmode="decimal">
        <button id="save" data-i="update"></button>
      </div>
    </div>
  </section>

  <section class="card" id="gaugeCard">
    <div class="gauge">
      <svg viewBox="0 0 200 112" aria-hidden="true">
        <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--track)" stroke-width="18" stroke-linecap="round"/>
        <path id="arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--ok)" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
      </svg>
      <div class="gc"><div class="t" data-i="leftToday"></div><div class="n" id="left"></div></div>
    </div>
    <div class="center"><span class="pill" id="pill"></span></div>
    <p class="center full" id="msg"></p>
    <div class="row center"><button class="ghost" id="adv" data-i="advBtn"></button></div>
  </section>


  <section class="card full">
    <b data-i="weekT"></b>
    <div class="bar" id="wk"></div>
    <div class="legend" id="wkl"></div>
    <div class="cols" id="cols"></div>
  </section>

  <section class="card full">
    <details>
      <summary data-i="settings"></summary>
      <div class="row" style="margin-top:10px">
        <label for="dow" data-i="resetOn"></label><select id="dow"></select>
        <input id="hh" type="number" min="0" max="23" aria-label="小时"> :
        <input id="mm" type="number" min="0" max="59" aria-label="分钟">
      </div>
      <div class="row" style="margin-top:8px"><label for="sd" data-i="dayStart"></label><input id="sd" type="number" min="0" max="100" step="0.5"></div>
      <p class="legend" data-i="dayStartNote"></p>
      <button id="apply" data-i="apply"></button>
    </details>
  </section>
  <p class="legend full" data-i="note"></p>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="sheet">
      <div class="top"><b id="mt"></b><button class="ghost sm" id="x" aria-label="关闭" title="关闭">✕</button></div>
      <p id="mb" class="sub"></p>
      <div id="routes"></div>
      <button id="close" data-i="close" style="width:100%"></button>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
